      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],

              50: '#eef2ff',

</head>

  <!-- Audio & Game Engine Script -->
  <script>
    /* --- Modern Sound System via Web Audio API --- */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTick() {
        if (this.muted) return;
        this.initContext();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.04);

          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {
          console.warn("Audio error:", e);
        }
      }

      playFanfare() {
        if (this.muted) return;
        this.initContext();
        if (!this.ctx) return;

        try {
          // Play a delightful ascending chord arpeggio
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            const startTime = this.ctx.currentTime + (idx * 0.1);
            const duration = 0.35;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.2, startTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
          });
        } catch (e) {
          console.warn("Audio error:", e);
        }
      }
    }

    const sounds = new SoundEngine();

    /* --- Preset Definitions --- */
    const PRESETS = {
      prizes: [
        { text: "Grand Prize 🎁", color: "#F43F5E" },
        { text: "Gift Card 💳", color: "#EC4899" },
        { text: "Free Coffee ☕", color: "#8B5CF6" },
        { text: "Mystery Box 📦", color: "#3B82F6" },
        { text: "High Five ✋", color: "#10B981" },
        { text: "Extra Spin 🔄", color: "#F59E0B" }
      ],
      decision: [
        { text: "Yes, definitely! 👍", color: "#10B981" },
        { text: "No way 🙅", color: "#EF4444" },
        { text: "Ask again later ⏳", color: "#F59E0B" },
        { text: "Maybe 🤔", color: "#6366F1" }
      ],
      food: [
        { text: "Pizza 🍕", color: "#EF4444" },
        { text: "Burgers 🍔", color: "#F59E0B" },
        { text: "Sushi 🍣", color: "#EC4899" },
        { text: "Tacos 🌮", color: "#8B5CF6" },
        { text: "Salad 🥗", color: "#10B981" },
        { text: "Pasta 🍝", color: "#3B82F6" }
      ],
      truthOrDare: [
        { text: "Truth 🗣️", color: "#3B82F6" },
        { text: "Dare 🔥", color: "#EF4444" },
        { text: "Double Dare ⚡", color: "#F59E0B" },
        { text: "Pass Free 🎟️", color: "#10B981" }
      ],
      Raffle: [
        { text: "Name 1", color: "#EF4444" },
        { text: "Name 2", color: "#F97316" },
        { text: "Name 3", color: "#F59E0B" },
        { text: "Name 4", color: "#84CC16" },
        { text: "Name 5", color: "#10B981" },
        { text: "Name 6", color: "#06B6D4" },
        { text: "Name 7", color: "#3B82F6" },
        { text: "Name 8", color: "#6366F1" },
        { text: "Name 9", color: "#8B5CF6" },
        { text: "Name 10", color: "#EC4899" }
      ]
    };

    const VIBRANT_PALETTE = [
      "#F43F5E", "#EC4899", "#8B5CF6", "#6366F1", "#3B82F6",
      "#0EA5E9", "#06B6D4", "#14B8A6", "#10B981", "#84CC16",
      "#EAB308", "#F97316"
    ];

    /* --- Application State --- */
    let entries = JSON.parse(JSON.stringify(PRESETS.prizes));
    let currentRotation = 0; // In radians
    let isSpinning = false;
    let angularVelocity = 0;
    let friction = 0.985;
    let lastSegmentIndex = -1;
    let winnerIndex = null;

    /* --- DOM Elements --- */
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const entriesList = document.getElementById('entriesList');
    const entriesCountBadge = document.getElementById('entriesCountBadge');
    const presetSelect = document.getElementById('presetSelect');
    const addEntryForm = document.getElementById('addEntryForm');
    const entryInput = document.getElementById('entryInput');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');
    const winnerModal = document.getElementById('winnerModal');
    const modalCard = document.getElementById('modalCard');
    const winnerName = document.getElementById('winnerName');
    const spinAgainBtn = document.getElementById('spinAgainBtn');
    const removeWinnerBtn = document.getElementById('removeWinnerBtn');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    /* --- Toast Notification Helper --- */
    let toastTimeout = null;
    function showToast(msg) {
      clearTimeout(toastTimeout);
      toastMessage.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-16', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-16', 'pointer-events-none');
      }, 2200);
    }

    /* --- Drawing the Wheel --- */
    function drawWheel() {
      const width = canvas.width;
      const height = canvas.height;
      const center = width / 2;
      const radius = center - 24;

      ctx.clearRect(0, 0, width, height);

      const numSlices = entries.length;
      if (numSlices === 0) {
        // Draw empty fallback wheel
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 10;
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '600 32px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Please add at least 1 entry', center, center);
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;

      // Outer Decorative Rim
      ctx.save();
      ctx.beginPath();
      ctx.arc(center, center, radius + 10, 0, 2 * Math.PI);
      ctx.fillStyle = '#0f172a';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.restore();

      // Draw Segments
      for (let i = 0; i < numSlices; i++) {
        const angle = currentRotation + i * sliceAngle;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, angle, angle + sliceAngle);
        ctx.closePath();

        ctx.fillStyle = entries[i].color || VIBRANT_PALETTE[i % VIBRANT_PALETTE.length];
        ctx.fill();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Slice Text Rendering
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(angle + sliceAngle / 2);

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4;

        // Auto-scale font size depending on number of items
        const fontSize = Math.max(16, Math.min(32, Math.floor(400 / numSlices + 14)));
        ctx.font = `bold ${fontSize}px Outfit, Inter, sans-serif`;

        // Truncate text if excessively long
        let text = entries[i].text;
        if (text.length > 20) text = text.substring(0, 18) + '…';

        ctx.fillText(text, radius - 35, 0);
        ctx.restore();
      }

      // Outer Ring Accent Border
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();

      // Outer Edge Golden Pegs
      for (let i = 0; i < numSlices; i++) {
        const pegAngle = currentRotation + i * sliceAngle;
        const px = center + (radius - 2) * Math.cos(pegAngle);
        const py = center + (radius - 2) * Math.sin(pegAngle);

        ctx.beginPath();
        ctx.arc(px, py, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#F8FAFC';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 5;
        ctx.fill();
      }

      // Center Hub with 3D Bevel effect
      ctx.save();
      ctx.beginPath();
      ctx.arc(center, center, 56, 0, 2 * Math.PI);
      ctx.fillStyle = '#0f172a';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(center, center, 44, 0, 2 * Math.PI);
      const gradient = ctx.createLinearGradient(center - 40, center - 40, center + 40, center + 40);
      gradient.addColorStop(0, '#6366f1');
      gradient.addColorStop(1, '#ec4899');
      ctx.fillStyle = gradient;
      ctx.fill();

      // Center Wheel Icon
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SPIN', center, center);
    }

    /* --- Spin Physics & Loop --- */
    function getPointerSegmentIndex() {
      if (entries.length === 0) return -1;
      const numSlices = entries.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      // Pointer rests at top (3 * PI / 2 radians or -PI/2)
      const pointerAngle = (3 * Math.PI) / 2;

      // Normalize normalized angle offset
      let normalized = (pointerAngle - currentRotation) % (2 * Math.PI);
      if (normalized < 0) normalized += 2 * Math.PI;

      return Math.floor(normalized / sliceAngle) % numSlices;
    }

    function triggerSpin() {
      if (isSpinning || entries.length < 2) {
        if (entries.length < 2) {
          showToast("Please add at least 2 entries to spin!");
        }
        return;
      }

      sounds.initContext();
      isSpinning = true;
      spinBtn.disabled = true;

      // Initial angular velocity: 0.35 to 0.55 rad/frame + random boost
      angularVelocity = 0.38 + Math.random() * 0.22;
      friction = 0.987 + Math.random() * 0.005; // dynamic deceleration
      lastSegmentIndex = getPointerSegmentIndex();

      requestAnimationFrame(animationLoop);
    }

    function animationLoop() {
      if (!isSpinning) return;

      currentRotation += angularVelocity;
      currentRotation %= (2 * Math.PI);

      // Check current segment passing top pointer to trigger click sound
      const currentSegment = getPointerSegmentIndex();
      if (currentSegment !== lastSegmentIndex) {
        sounds.playTick();
        lastSegmentIndex = currentSegment;
      }

      // Apply friction
      angularVelocity *= friction;

      // Stop threshold
      if (angularVelocity < 0.0018) {
        angularVelocity = 0;
        isSpinning = false;
        spinBtn.disabled = false;
        drawWheel();
        handleSpinComplete(lastSegmentIndex);
        return;
      }

      drawWheel();
      requestAnimationFrame(animationLoop);
    }

    /* --- Post-Spin Celebration --- */
    function handleSpinComplete(winningIdx) {
      winnerIndex = winningIdx;
      const winner = entries[winningIdx];
      if (!winner) return;

      sounds.playFanfare();

      // Confetti burst
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      // Show Winner Modal
      winnerName.textContent = winner.text;
      winnerModal.classList.remove('opacity-0', 'pointer-events-none');
      winnerModal.classList.add('opacity-100');
      modalCard.classList.remove('scale-90');
      modalCard.classList.add('scale-100');
    }

    function closeModal() {
      winnerModal.classList.remove('opacity-100');
      winnerModal.classList.add('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-90');
    }

    /* --- Entries Management --- */
    function renderEntries() {
      entriesList.innerHTML = '';
      entriesCountBadge.textContent = `${entries.length} Entries`;

      entries.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between gap-2 p-2 rounded-lg bg-slate-800/80 border border-slate-700/60 hover:border-slate-600 transition group";

        row.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <input type="color" data-index="${index}" value="${item.color}" class="color-picker w-6 h-6 rounded border-0 cursor-pointer bg-transparent">
            <input type="text" data-index="${index}" value="${item.text.replace(/"/g, '&quot;')}" class="entry-edit-input flex-1 bg-transparent text-sm text-slate-100 focus:outline-none focus:border-b focus:border-indigo-500 font-medium truncate">
          </div>
          <button data-index="${index}" class="delete-btn text-slate-400 hover:text-rose-400 p-1 rounded transition opacity-80 group-hover:opacity-100" title="Delete entry">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        `;

        entriesList.appendChild(row);
      });

      drawWheel();
    }

    /* --- Event Listeners --- */
    // Wheel Tap / Click
    canvas.addEventListener('click', () => {
      triggerSpin();
    });

    // Spin Button Click
    spinBtn.addEventListener('click', () => {
      triggerSpin();
    });

    // Add Entry Form Submit
    addEntryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = entryInput.value.trim();
      if (!val) return;

      const randomColor = VIBRANT_PALETTE[entries.length % VIBRANT_PALETTE.length];
      entries.push({ text: val, color: randomColor });
      entryInput.value = '';

      renderEntries();
      showToast(`Added "${val}"`);
    });

    // Change Preset Wheel
    presetSelect.addEventListener('change', (e) => {
      const selected = PRESETS[e.target.value];
      if (selected) {
        entries = JSON.parse(JSON.stringify(selected));
        renderEntries();
        showToast("Preset loaded successfully!");
      }
    });

    // Shuffle Entries
    shuffleBtn.addEventListener('click', () => {
      if (entries.length < 2) return;
      for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
      }
      renderEntries();
      showToast("Entries shuffled!");
    });

    // Clear All Entries
    clearAllBtn.addEventListener('click', () => {
      if (entries.length === 0) return;
      entries = [];
      renderEntries();
      showToast("Cleared all entries.");
    });

    // Entries delegation: Delete & Inline Edit
    entriesList.addEventListener('input', (e) => {
      if (e.target.classList.contains('entry-edit-input')) {
        const index = parseInt(e.target.dataset.index, 10);
        entries[index].text = e.target.value;
        drawWheel();
      }
      if (e.target.classList.contains('color-picker')) {
        const index = parseInt(e.target.dataset.index, 10);
        entries[index].color = e.target.value;
        drawWheel();
      }
    });

    entriesList.addEventListener('click', (e) => {
      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn) {
        const index = parseInt(deleteBtn.dataset.index, 10);
        const removed = entries.splice(index, 1);
        renderEntries();
        showToast(`Removed "${removed[0].text}"`);
      }
    });

    // Sound Toggle
    soundToggleBtn.addEventListener('click', () => {
      sounds.muted = !sounds.muted;
      if (sounds.muted) {
        soundIcon.textContent = '🔇';
        soundLabel.textContent = 'Muted';
        soundToggleBtn.classList.add('text-slate-400');
        showToast("Sound muted");
      } else {
        sounds.initContext();
        soundIcon.textContent = '🔊';
        soundLabel.textContent = 'Sound ON';
        soundToggleBtn.classList.remove('text-slate-400');
        showToast("Sound enabled");
      }
    });

    // Modal Actions
    spinAgainBtn.addEventListener('click', () => {
      closeModal();
      setTimeout(triggerSpin, 300);
    });

    removeWinnerBtn.addEventListener('click', () => {
      if (winnerIndex !== null && entries[winnerIndex]) {
        const removed = entries.splice(winnerIndex, 1);
        renderEntries();
        closeModal();
        showToast(`Removed "${removed[0].text}"`);
      }
    });

    winnerModal.addEventListener('click', (e) => {
      if (e.target === winnerModal) {
        closeModal();
      }
    });

    // Responsive Canvas Resizing support
    function resizeCanvas() {
      drawWheel();
    }
    window.addEventListener('resize', resizeCanvas);

    // Initial Setup
    window.onload = function() {
      renderEntries();
      drawWheel();
    };
  </script>
</body>
</html>
